server {
    listen 8080;
    host localhost;
    root ./www;
    index index.html;

    server_name localhost;

    client_max_body_size 1048576;

	error_page 404 errors/404.html;

    autoindex off;
    
    location / {
        allow_methods GET POST DELETE;
        root ./www;
        index index.html;
		cgi_extension .py;
		cgi_path /usr/bin/python3;
    }
	
	location /scripts {
		allow_methods GET POST;
		#cgi_extension .py;
		#cgi_path /usr/bin/python3;
        cgi_extension .bla;
        cgi_path "";
	}

    location /nuevascamis {
        allow_methods GET;
        root ./www;
        # index index.html;
		autoindex on;
    }

	location /redirects {
		allow_methods GET POST;
		root ./www;
		return 302 /nuevascamis/camiseta_roja.html;
	}

    #location /upload {
    #    root ./www/uploads;
    #    allow_methods GET POST DELETE;
    #}
}

server {
    listen 8081;
    host localhost;
    root ./www;
    index index.html;

    server_name localhost;
    
    client_max_body_size 1024;

    autoindex off;

    location / {
        allow_methods GET POST DELETE;
        root ./www;
        index index.html;
    }
}