# INVALID on purpose: two server blocks share host:port without distinct
# server_name -- per the project's own validation this must be rejected
# at config-parse time (webserv must exit cleanly, not crash), matching
# the evalsheet's "Port issues" check ("should result in an error, unless
# the team implemented virtual hosts").

server {
    listen 8540;
    host 127.0.0.1;
    root www/site_default;
    index index.html;

    location / {
        allow_methods GET;
        root www/site_default;
    }
}

server {
    listen 8540;
    host 127.0.0.1;
    root www/site_b;
    index index.html;

    location / {
        allow_methods GET;
        root www/site_b;
    }
}
