# Dedicated CGI config, isolated so a misbehaving CGI script (infinite
# loop, crash, ...) cannot be blamed on unrelated routes.

server {
    listen 8520;
    host 127.0.0.1;
    root www/cgi-bin;
    index index.html;

    client_max_body_size 5M;

    location / {
        allow_methods GET POST;
        root www/cgi-bin;
        cgi_extension .py;
        cgi_path /usr/bin/python3;
    }
}
