# Small client_max_body_size (100 bytes) to make it trivial to cross the
# limit deterministically, per evalsheet "Configuration" checks.

server {
    listen 8510;
    host 127.0.0.1;
    root www/bodylimit_root;
    index index.html;

    client_max_body_size 100;

    location / {
        allow_methods GET POST;
        root www/bodylimit_root;
        index index.html;
    }
}
