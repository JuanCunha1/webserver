# INVALID on purpose: two locations with the same path in one server.
# The parser is expected to reject this (ConfigParserValidations.cpp
# rejects duplicate location paths) -- webserv must exit cleanly, not crash.

server {
    listen 8530;
    host 127.0.0.1;
    root www/site_default;
    index index.html;

    location / {
        allow_methods GET;
        root www/site_default;
    }

    location / {
        allow_methods GET POST;
        root www/site_default;
    }
}
