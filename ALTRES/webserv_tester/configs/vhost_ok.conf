# Two server blocks sharing host:port, but WITH distinct server_name, so
# the project's own config validator should accept it (virtual hosts are
# explicitly out of scope for the mandatory part, but allowed).

server {
    listen 8541;
    host 127.0.0.1;
    root www/site_default;
    index index.html;
    server_name site_default.local;

    location / {
        allow_methods GET;
        root www/site_default;
    }
}

server {
    listen 8541;
    host 127.0.0.1;
    root www/site_b;
    index index.html;
    server_name site_b.local;

    location / {
        allow_methods GET;
        root www/site_b;
    }
}
