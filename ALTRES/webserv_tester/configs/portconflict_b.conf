# Different config file, but deliberately listens on the SAME port as
# portconflict_a.conf, to check the "two webserv processes, same port"
# scenario from the evalsheet's "Port issues" section.

server {
    listen 8550;
    host 127.0.0.1;
    root www/site_b;
    index index.html;

    location / {
        allow_methods GET;
        root www/site_b;
    }
}
