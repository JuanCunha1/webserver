# Main functional test config: two servers on two ports (different content),
# custom error page, per-route allowed methods, CGI, autoindex on/off,
# a "return" redirect, and an uploads route.

server {
    listen 8500;
    host 127.0.0.1;
    root www/site_default;
    index index.html;
    server_name main;

    client_max_body_size 5M;
    autoindex off;

    error_page 404 www/errors/404.html;

    location / {
        allow_methods GET POST DELETE;
        root www/site_default;
        index index.html;
    }

    location /readonly {
        allow_methods GET;
        root www/site_default;
    }

    location /uploads {
        allow_methods GET POST DELETE;
        root www/site_default;
        upload_store www/site_default/uploads;
    }

    location /cgi-bin {
        allow_methods GET POST;
        root www/cgi-bin;
        cgi_extension .py;
        cgi_path /usr/bin/python3;
    }

    location /redirect {
        allow_methods GET;
        root www/site_default;
        return 302 /index.html;
    }

    location /autoindex-on {
        allow_methods GET;
        root www/autoindex_dir;
        autoindex on;
    }

    location /autoindex-off {
        allow_methods GET;
        root www/autoindex_dir;
        autoindex off;
    }
}

server {
    listen 8501;
    host 127.0.0.1;
    root www/site_b;
    index index.html;
    server_name secondary;

    client_max_body_size 1M;
    autoindex off;

    location / {
        allow_methods GET;
        root www/site_b;
        index index.html;
    }
}
