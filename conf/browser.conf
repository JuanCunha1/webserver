server {
    listen 9999;
    host 127.0.0.1;
    server_name test;
    
    location / {
        root www/browser_static;
        index index.html;
        autoindex on;
        allow_methods GET;
    }
    
    location /archivos {
		root www/archivos;
		autoindex on;
	}
	
	location /intra {
    	return 301 https://auth.42.fr/auth/realms/students-42/protocol/openid-connect/auth?client_id=frontend-react&redirect_uri=https%3A%2F%2Fprofile-v3.intra.42.fr&response_type=code&scope=openid&state=3fbe18fead384d4b931d7d9646b55735&code_challenge=K8RhlrkXHh9WVZqPwjbd--KgA_5IHuGuURfb1Gan0hU&code_challenge_method=S256&response_mode=query;
	}
	
	location /img {
		root www/img;
		allow_methods GET;
        autoindex on; # Ponemos autoindex para que puedas ver el menú si entras solo a /img
	}
}
