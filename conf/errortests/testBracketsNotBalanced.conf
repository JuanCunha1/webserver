# ==========================================
# Archivo de configuración de prueba Webserv
# ==========================================

server {{
    # El puerto donde el servidor escuchará las peticiones
    listen 8080;

    # La dirección IP (localhost)
    host 127.0.0.1;

    # Nombres de dominio de este servidor
    server_name miservidor.com;

    # La carpeta principal donde guardas tus archivos web
    root /var/www/html;

    # Límite de tamaño para subir archivos (ej: 1MB)
    client_max_body_size 1000000;

    # Página de error personalizada para el código 404 (Not Found)
    error_page 404 /404.html;

    # Reglas específicas para la ruta principal ("/")
    location / {
        # Métodos HTTP que permitimos usar aquí
        allow_methods GET POST;

        # Mostrar lista de archivos si no hay un index.html (on/off)
        autoindex on;
    }
}