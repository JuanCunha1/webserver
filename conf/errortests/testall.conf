# ==========================================
# Archivo de configuración de prueba Webserv
# ==========================================

# SERVIDOR 1: Configuración principal y exhaustiva
server {
    listen 8080;
    host 127.0.0.1;
    server_name miservidor.com www.miservidor.com;
    root /var/www/html;
    index index.html;
    client_max_body_size 10000000;

    # Prueba de múltiples páginas de error
    error_page 404 403 /40x.html;
    error_page 500 502 503 504 /50x.html;

    # Location 1: Prueba básica y autoindex
    location / {
        allow_methods GET POST;
        autoindex on;
    }

    # Location 2: Sobrescribir root e index
    location /assets {
        root /var/www/assets;
        index default.html;
        allow_methods GET;
        autoindex off;
    }

    # Location 3: Prueba de redirección con código (301)
    location /old-page {
        return 301 /new-page.html;
    }

    # Location 4: Prueba de redirección sin código (Nginx default 302)
    location /temporary {
        return /maintenance.html;
    }
}

# SERVIDOR 2: Servidor mínimo para probar el bucle de múltiples servidores
server {
    listen 8081;
    host 0.0.0.0;
    
    location /api {
        allow_methods GET POST DELETE;
        return 308 /api/v2;
    }
}