server {
    listen 8080;
    host localhost; # Defines on which network interface and local IP the socket's bind() is done (127.0.0.1, 0.0.0.0, etc.).
    root ./www;
    index index.html;

    server_name localhost; # Defines the domain name assigned to this server block to resolve Virtual Hosting.

    client_max_body_size 1048576;

	error_page 404 errors/404.html;

    autoindex off;
    
    location / {
        allow_methods GET POST DELETE;
        root ./www;
        index index.html;
		cgi_extension .py;
		cgi_path /usr/bin/python3;
    }
	
	location /scripts {
		allow_methods GET POST;
		#cgi_extension .py;
		#cgi_path /usr/bin/python3;
        cgi_extension .bla;
        cgi_path "";
	}

    location /nuevascamis {
        allow_methods GET;
        root ./www;
        # index index.html;
		autoindex on;
    }

	location /directorioprueba {
        allow_methods GET POST;
        root ./www;
        # index index.html;
		autoindex off;
    }

	location /kapouet {
        allow_methods GET POST;
        root ./www;
        # index index.html;
		autoindex off;
		upload_store ./www/subidas;
    }

	location /redirects {
		allow_methods GET POST;
		root ./www;
		return 302 /nuevascamis/camiseta_roja.html;
	}

    location /uploads {
		autoindex off;
        root ./www;
        allow_methods GET POST DELETE;
    }
}

server {
    listen 8081;
    host localhost;
    root ./www;
    index index.html;

    server_name guillee;
    
    client_max_body_size 1024;

    autoindex off;

    location / {
        allow_methods GET POST DELETE;
        root ./www;
        index index.html;
    }
}