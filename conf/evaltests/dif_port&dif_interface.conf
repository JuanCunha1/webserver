server {
    listen 8080;
    host 127.0.0.1;
    server_name localhost;
    location / {
        root www/port_web_8080;
        allow_methods GET;
    }
}

server {
    listen 8081; # different port
    host 127.0.0.1;
    server_name localhost;
    location / {
        root www/port_web_8081;
        allow_methods GET;
    }
}

server {
    listen 8080;
    host 10.11.13.4; # different interface
    server_name localhost;
    location / {
        root www/port_web_8080;
        allow_methods GET;
    }
}


