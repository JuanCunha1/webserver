server {
    listen 8081;
    host 127.0.0.1;
    server_name mivirtualhost.com www.mivirtualhost.com;
    root /tmp;
    index hola.html;
    client_max_body_size 5M;
    error_page 404 403 /404.html;
    error_page 500 502 /50x.html;

    location / {
        allow_methods GET;
        autoindex on;
    }
}
