server {
    listen 8080;
    host localhost;
    root ./www;
    index index.html;

    server_name localhost; # Defines the domain name assigned to this server block to resolve Virtual Hosting.

    client_max_body_size 8945345345345;

	error_page 404 errors/404.html;

    autoindex off;
    
    location / {
        allow_methods GET POST DELETE;
        root ./www;
        index index.html;
    }

	location /camisetas {
        allow_methods GET POST;
        root ./www/ropa/camisetas;
        index index.html;
		autoindex off;
    }

    location /uploads {
		autoindex off;
        root ./www/uploads;
        allow_methods GET POST DELETE;
		upload_store ./www/uploads;
    }
}